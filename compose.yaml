services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-dozy_catalog}'
      - 'POSTGRES_USER=${POSTGRES_USER:-dozy_catalog}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?.env.example을 .env로 복사하고 값을 채워주세요}'
    ports:
      - '5432'

  # 상품 이벤트를 보낼 Kafka(docs/adr/0021). KRaft 단일 노드다.
  # spring-boot-docker-compose가 컨테이너 포트 9092의 매핑을 읽어 연결하므로 9092를 호스트로 내보낸다.
  # Kafka는 접속한 클라이언트에게 자기 주소를 알려 주기 때문에 호스트 포트를 임의로 바꿀 수 없다(광고 주소와 같아야 한다).
  # 이미 9092를 쓰는 프로세스가 있으면 먼저 내린다.
  kafka:
    image: 'apache/kafka:3.9.1'
    ports:
      - '9092:9092'
    environment:
      - 'KAFKA_NODE_ID=1'
      - 'KAFKA_PROCESS_ROLES=broker,controller'
      - 'KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093'
      - 'KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092'
      - 'KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER'
      - 'KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      - 'KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093'
      - 'KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1'
      - 'KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1'
      - 'KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1'
