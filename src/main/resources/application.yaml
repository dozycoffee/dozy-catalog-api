# local(default) — 프로파일 미지정 시. spring-boot-docker-compose가 compose.yaml의 postgres 컨테이너를
# 자동 기동/탐지해 R2DBC ConnectionFactory 빈을 구성하므로 여기엔 접속 정보를 두지 않는다.
# 개인용 오버라이드가 필요하면 application-local.yaml(.gitignore 처리됨)을 만들어 사용할 것.
spring:
  application:
    name: dozy-catalog-api
  r2dbc:
    # 커넥션 풀(r2dbc-pool). Exposed 트랜잭션 하나가 연결 하나를 빌려 쓰고 끝나면 돌려준다.
    # 운영 규모가 정해지면 max-size를 다시 정한다. PostgreSQL max_connections를 인스턴스 수 × max-size보다 크게 둔다.
    pool:
      initial-size: 2
      max-size: 10
      max-idle-time: 10m

management:
  endpoints:
    web:
      exposure:
        include: health, info

# 토큰 검증은 dozy-auth 스타터가 맡는다(docs/api/README.md 경로와 인가).
# Catalog는 realm internal의 토큰(본사 직원, 서비스 계정)만 받는다. 가맹점주 요청은 Store 서비스를 거쳐 들어온다(docs/adr/0018).
dozy:
  auth:
    audience: catalog
    accepted-realms: [internal]
    # Auth 주소. 허용 issuer는 {base}/realms/internal, JWKS는 {base}/.well-known/jwks.json.
    # 기본값은 dozy-auth를 로컬로 띄웠을 때의 주소다. JWKS는 첫 요청 때 받으므로 Auth 없이도 앱은 뜬다.
    issuer-base-uri: ${DOZY_AUTH_ISSUER_BASE_URI:http://localhost:8080}
    # k8s·로드밸런서 프로브용. 그 밖의 모든 요청은 토큰이 필요하다.
    public-paths: [/actuator/health, /actuator/health/**]

catalog:
  # 업무 기준 시간대. 예약 적용일의 00시를 이 시간대로 해석한다(docs/adr/0010). 서버·JVM·DB 시간대는 UTC로 둔다.
  business-zone: Asia/Seoul
  schedule:
    batch:
      # 예약 적용 배치(ScheduledChangeBatchScheduler). 앞 실행이 끝난 뒤 이 간격마다 적용 시각이 지난 대기 예약을 적용한다.
      # 인스턴스마다 켜 둬도 된다(예약마다 잠그므로 두 번 적용되지 않는다). 통합 테스트에서는 끈다(IntegrationTest).
      enabled: true
      fixed-delay: PT1M
  exposure:
    # 전체 매장 목록. 매장의 원본은 Store BC지만 호출 방식이 정해지기 전이라, 노출 현황 조회가
    # 판매 범위 All인 상품의 판매 가능 매장으로 이 설정값을 쓴다(5단계에서 실제 호출로 교체).
    store-ids: []

---
spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # Flyway는 R2DBC를 지원하지 않아 앱 시작 시 JDBC로 한 번 실행된다. 로컬·테스트는 docker-compose와
  # Testcontainers가 JDBC 연결 정보를 자동으로 주지만, prod는 R2DBC와 같은 환경 변수로 직접 지정한다.
  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
dozy:
  auth:
    # 운영은 기본값을 쓰지 않고 반드시 지정한다.
    issuer-base-uri: ${DOZY_AUTH_ISSUER_BASE_URI}
