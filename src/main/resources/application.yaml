# local(default) — 프로파일 미지정 시. spring-boot-docker-compose가 compose.yaml의 postgres 컨테이너를
# 자동 기동/탐지해 R2DBC ConnectionFactory 빈을 구성하므로 여기엔 접속 정보를 두지 않는다.
# 개인용 오버라이드가 필요하면 application-local.yaml(.gitignore 처리됨)을 만들어 사용할 것.
spring:
  application:
    name: dozy-catalog-api
  kafka:
    # 상품 이벤트를 보낼 Kafka(docs/adr/0021). 로컬은 spring-boot-docker-compose가 compose.yaml의 kafka 컨테이너를 연결한다.
    # 프로듀서는 첫 전송 때 연결하므로 Kafka가 없어도 앱은 뜨고, 이벤트는 아웃박스에 쌓인다.
    producer:
      # 브로커 복제본이 모두 받았다고 확인한 뒤에야 전송 성공으로 본다. 멱등 전송으로 재시도 중복과 순서 역전을 막는다.
      acks: all
      properties:
        enable.idempotence: true
        # 전송 확인을 기다리는 시간의 상한. catalog.outbox.relay.send-timeout 안에 끝나도록 더 짧게 둔다.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 8000
  r2dbc:
    # 커넥션 풀(r2dbc-pool). Exposed 트랜잭션 하나가 연결 하나를 빌려 쓰고 끝나면 돌려준다.
    # 운영 규모가 정해지면 max-size를 다시 정한다. PostgreSQL max_connections를 인스턴스 수 × max-size보다 크게 둔다.
    pool:
      initial-size: 2
      max-size: 10
      max-idle-time: 10m

management:
  metrics:
    distribution:
      # p95·p99를 Prometheus에서 계산하려면 요청 시간의 히스토그램 버킷이 필요하다(비기능 요구사항 4.4, 부하테스트 loadtest/).
      percentiles-histogram:
        http.server.requests: true
    tags:
      # 모든 지표에 붙는 서비스 이름. 한 Prometheus에서 여러 서비스를 모을 때 구분한다.
      # 버전·인스턴스처럼 값이 자주 바뀌는 것은 넣지 않는다(시계열이 새로 생기므로).
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

# 토큰 검증은 dozy-auth 스타터가 맡는다(docs/api/README.md 경로와 인가).
# Catalog는 realm internal의 토큰(본사 직원, 서비스 계정)만 받는다. 가맹점주 요청은 Store 서비스를 거쳐 들어온다(docs/adr/0018).
dozy:
  auth:
    audience: catalog
    accepted-realms: [internal]
    # Auth 주소. 허용 issuer는 {base}/realms/internal, JWKS는 {base}/.well-known/jwks.json.
    # 기본값은 dozy-auth를 로컬로 띄웠을 때의 주소다. JWKS는 첫 요청 때 받으므로 Auth 없이도 앱은 뜬다.
    issuer-base-uri: ${DOZY_AUTH_ISSUER_BASE_URI:http://localhost:8080}
    # k8s·로드밸런서 프로브와 Prometheus 수집용. 그 밖의 모든 요청은 토큰이 필요하다.
    # 지표에는 비밀값·개인정보가 없고 수집기가 짧은 수명의 토큰을 갱신하기 어려워 토큰 없이 연다.
    # 외부에서 닿지 않게 하는 것은 배포 환경이 맡는다.
    public-paths: [/actuator/health, /actuator/health/**, /actuator/prometheus]

catalog:
  cors:
    # 본사 API를 브라우저에서 부를 수 있는 출처(관리 콘솔). 쉼표로 구분하고 와일드카드는 쓰지 않는다.
    # 로컬 기본값은 dozy-auth와 같은 관리 콘솔 주소다. prod는 기본값 없이 반드시 지정한다(아래 prod 프로필).
    allowed-origins: ${CATALOG_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    # 공개 경로(/api/v1/public/**)를 브라우저에서 직접 읽는 웹 채널의 출처. 본사 API 출처와 따로 둔다. 로컬 기본값은 채널 웹의 개발 서버 주소다.
    public-allowed-origins: ${CATALOG_PUBLIC_CORS_ALLOWED_ORIGINS:http://localhost:3001}
  build:
    # 실행 중인 서버의 버전(dozy.catalog.build.info 지표, 기동 로그). 없으면 각각 unknown, local이다.
    # revision은 CI가 이미지를 만들 때 넣고, 릴리스 버전은 배포가 이미지 태그의 X.Y.Z로 알려 준다.
    revision: ${CATALOG_REVISION:}
    release-version: ${CATALOG_RELEASE_VERSION:}
  # 업무 기준 시간대. 예약 적용일의 00시를 이 시간대로 해석한다(docs/adr/0010). 서버·JVM·DB 시간대는 UTC로 둔다.
  business-zone: Asia/Seoul
  schedule:
    batch:
      # 예약 적용 배치(ScheduledChangeBatchScheduler). 앞 실행이 끝난 뒤 이 간격마다 적용 시각이 지난 대기 예약을 적용한다.
      # 인스턴스마다 켜 둬도 된다(예약마다 잠그므로 두 번 적용되지 않는다). 통합 테스트에서는 끈다(IntegrationTest).
      enabled: true
      fixed-delay: PT1M
  outbox:
    relay:
      # 아웃박스에 쌓인 상품 이벤트를 Kafka로 보낸다. 인스턴스마다 켜 둬도 한 번에 한 인스턴스만 보낸다. 통합 테스트에서는 끈다.
      enabled: true
      fixed-delay: PT1S
      # 한 번에 읽는 건수. 전송을 기다리는 동안 DB 트랜잭션을 잡고 있으므로 작게 둔다.
      batch-size: 100
      # 한 이벤트가 이만큼 실패하면 격리한다(뒤의 이벤트를 막지 않기 위해). Kafka 장애 중의 실패는 세지 않는다.
      max-attempts: 5
      send-timeout: PT10S
    cleanup:
      # 전송이 끝난 이벤트의 보관 기간. 장애를 조사하거나 구독자가 요청할 때 다시 볼 수 있게 잠시 남긴다.
      retention: P3D
      fixed-delay: PT1H
      batch-size: 1000
  exposure:
    # 전체 매장 목록. 매장의 원본은 Store BC지만 호출 방식이 정해지기 전이라, 노출 현황 조회가
    # 판매 범위 All인 상품의 판매 가능 매장으로 이 설정값을 쓴다(5단계에서 실제 호출로 교체).
    store-ids: []

---
spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # Flyway는 R2DBC를 지원하지 않아 앱 시작 시 JDBC로 한 번 실행된다. 로컬·테스트는 docker-compose와
  # Testcontainers가 JDBC 연결 정보를 자동으로 주지만, prod는 R2DBC와 같은 환경 변수로 직접 지정한다.
  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
dozy:
  auth:
    # 운영은 기본값을 쓰지 않고 반드시 지정한다.
    issuer-base-uri: ${DOZY_AUTH_ISSUER_BASE_URI}
    # Catalog가 Store 서비스를 부를 때 쓰는 system token 클라이언트(판매 범위의 대상 매장 확인). 토큰 발급·캐시는 스타터가 맡는다.
    client:
      enabled: true
      client-id: ${DOZY_AUTH_CLIENT_ID:svc-catalog}
      client-secret: ${DOZY_AUTH_CLIENT_SECRET}
catalog:
  cors:
    # 운영은 기본값을 쓰지 않고 반드시 지정한다.
    allowed-origins: ${CATALOG_CORS_ALLOWED_ORIGINS}
    # 웹 채널이 없으면 비워 둔다. 비어 있으면 공개 경로에 어떤 출처도 허용하지 않는다(네이티브 앱·서버 호출은 CORS와 무관하다).
    public-allowed-origins: ${CATALOG_PUBLIC_CORS_ALLOWED_ORIGINS:}
  store:
    # Store 서비스 주소. 운영은 반드시 지정한다 — 없으면 판매 범위의 대상 매장을 확인하지 않는 로컬용 구현이 쓰이므로 기동하지 않게 한다.
    base-url: ${STORE_BASE_URL}
