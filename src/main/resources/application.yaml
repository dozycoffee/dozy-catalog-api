# local(default) — 프로파일 미지정 시. spring-boot-docker-compose가 compose.yaml의 postgres 컨테이너를
# 자동 기동/탐지해 R2DBC ConnectionFactory 빈을 구성하므로 여기엔 접속 정보를 두지 않는다.
# 개인용 오버라이드가 필요하면 application-local.yaml(.gitignore 처리됨)을 만들어 사용할 것.
spring:
  application:
    name: dozy-catalog-api

management:
  endpoints:
    web:
      exposure:
        include: health, info

---
spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # Flyway는 R2DBC를 지원하지 않아 앱 시작 시 JDBC로 한 번 실행된다. 로컬·테스트는 docker-compose와
  # Testcontainers가 JDBC 연결 정보를 자동으로 주지만, prod는 R2DBC와 같은 환경 변수로 직접 지정한다.
  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
