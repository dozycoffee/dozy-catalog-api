name: Release

# main의 커밋에 v{major}.{minor}.{patch} 태그를 푸시하면 실행 이미지를 만들어 GitHub Container Registry에 올리고
# GitHub Release를 만든다(docs/adr/0019, README 배포 절).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # GitHub Release 생성
  packages: write # 이미지 푸시, dozy-auth 라이브러리 받기

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # main 포함 여부 검사에 전체 기록이 필요

      # 리뷰와 CI를 거친 코드만 배포한다. main에 없는 커밋에 붙인 태그는 실패시킨다.
      - name: 태그 커밋이 main에 있는지 확인
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME 태그의 커밋이 main에 없습니다."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 태그의 버전(v 제외)을 앱 버전으로 쓴다. 이미지에 넣기 전에 테스트까지 다시 돌린다.
      - name: 빌드와 테스트
        run: ./gradlew build -PappVersion="${GITHUB_REF_NAME#v}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 테스트 결과 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test-results/test/
            build/reports/tests/test/
          retention-days: 14

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 이미지 태그는 버전(0.1.0)과 커밋(sha-xxxxxxx)만 둔다. latest는 어떤 버전이 떠 있는지 모호해져 두지 않는다.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: GitHub Release 만들기
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --notes "이미지: \`${IMAGE}:${GITHUB_REF_NAME#v}\`"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
