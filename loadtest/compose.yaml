# 부하테스트용 인프라: PostgreSQL(+pg_stat_statements, 지표 수출), Prometheus, Grafana.
# Catalog 서버는 컨테이너가 아니라 jar로 직접 띄운다(scripts/app.sh). 로컬 dozy-auth의 issuer가 localhost 주소라
# 컨테이너 안에서는 토큰의 iss를 검증할 수 없기 때문이다. 자세한 설명은 README.
#
# 자원 제한은 docs/requirements.md 4.4의 초기 사양(DB 2 vCPU, 8GiB)이 기본값이다.
# Docker Desktop 메모리가 모자라면 .env의 LOADTEST_DB_MEMORY를 줄인다(개발·스모크용).
services:
  postgres:
    image: postgres:18
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=100
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "${LOADTEST_DB_PORT:-55432}:5432"
    cpus: ${LOADTEST_DB_CPUS:-2}
    mem_limit: ${LOADTEST_DB_MEMORY:-8g}
    volumes:
      - loadtest-pg:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://catalog:catalog@postgres:5432/catalog?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "${LOADTEST_PROMETHEUS_PORT:-9091}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - loadtest-prom:/prometheus

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "${LOADTEST_GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  loadtest-pg:
  loadtest-prom:
