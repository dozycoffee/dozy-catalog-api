# Catalog 서버는 같은 compose 네트워크의 컨테이너다. 인스턴스를 늘리면 compose.yaml과 여기에 함께 추가한다.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: dozy-catalog-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["catalog-1:8080"]
        labels: { instance: catalog-1 }
      - targets: ["catalog-2:8080"]
        labels: { instance: catalog-2 }

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
